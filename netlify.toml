[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback so client-side routes resolve to index.html. Function routes under
# /.netlify/functions/* are served before this and are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
